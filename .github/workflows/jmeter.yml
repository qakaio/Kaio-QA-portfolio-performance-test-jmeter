name: JMeter Performance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        type: choice
        options:
          - smoke
          - load
          - stress
        default: 'smoke'

env:
  JMETER_VERSION: 5.6.3
  JMETER_HOME: /opt/apache-jmeter-5.6.3
  JMETER_BIN: /opt/apache-jmeter-5.6.3/bin
  TEST_TYPE: ${{ github.event.inputs.test_type || 'smoke' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: JMeter Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and install JMeter
        run: |
          mkdir -p /opt
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz -O /tmp/jmeter.tgz
          tar -xzf /tmp/jmeter.tgz -C /opt
          ln -sf /opt/apache-jmeter-${{ env.JMETER_VERSION }} /opt/jmeter
          export JMETER_HOME=/opt/jmeter
          echo "JMETER_HOME=$JMETER_HOME" >> $GITHUB_ENV

      - name: Make JMeter executable
        run: chmod +x $JMETER_HOME/bin/jmeter

      - name: Install test scripts
        run: chmod +x tests/*.jmx scripts/*.py

      - name: Validate selected JMeter plan
        run: |
          case "$TEST_TYPE" in
            smoke) test_file="tests/api-smoke-test.jmx" ;;
            load) test_file="tests/jsonplaceholder-load-test.jmx" ;;
            stress) test_file="tests/api-stress-test.jmx" ;;
            *) echo "Unsupported test type: $TEST_TYPE"; exit 1 ;;
          esac
          python scripts/validate_jmeter_test.py "$test_file"

      - name: Run smoke validation before long runs
        if: env.TEST_TYPE != 'smoke'
        run: |
          $JMETER_HOME/bin/jmeter -n -t tests/api-smoke-test.jmx -l results-smoke.jtl -e -o reports-smoke \
            -Jjmeter.save.saveservice.output_format=csv \
            -Jjmeter.save.saveservice.assertion_results=all \
            -Jjmeter.save.saveservice.assertion_results_failure_message=true

      - name: Run JMeter Test
        run: |
          case "$TEST_TYPE" in
            smoke) test_file="tests/api-smoke-test.jmx" ;;
            load) test_file="tests/jsonplaceholder-load-test.jmx" ;;
            stress) test_file="tests/api-stress-test.jmx" ;;
            *) echo "Unsupported test type: $TEST_TYPE"; exit 1 ;;
          esac
          rm -rf reports
          $JMETER_HOME/bin/jmeter -n -t "$test_file" -l results-${{ env.TEST_TYPE }}.jtl -e -o reports \
            -Jjmeter.save.saveservice.output_format=csv \
            -Jjmeter.save.saveservice.assertion_results=all \
            -Jjmeter.save.saveservice.assertion_results_failure_message=true
        timeout-minutes: 60
        env:
          CI: true

      - name: Convert JTL to Allure Results
        if: always()
        run: |
          if [ -f "results-${{ env.TEST_TYPE }}.jtl" ]; then
            python scripts/jtl_to_allure.py results-${{ env.TEST_TYPE }}.jtl --output-dir allure-results-${{ env.TEST_TYPE }}
          else
            echo "No JTL result was produced; skipping Allure conversion."
          fi
        working-directory: .

      - name: Upload JTL Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results-${{ env.TEST_TYPE }}
          path: results-${{ env.TEST_TYPE }}.jtl
          retention-days: 30

      - name: Upload HTML Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-dashboard-${{ env.TEST_TYPE }}
          path: reports/
          retention-days: 30

  allure:
    name: Generate Allure Report
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Install Allure
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report --name "Kaio-QA-portfolio-performance-test-jmeter - JMeter Performance Test"
        env:
          ALLURE_RESULTS_DIR: allure-results

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure-report
          keep_files: true

  deploy-pages:
    name: Deploy JMeter Reports to GitHub Pages
    needs: allure
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download HTML Dashboards
        uses: actions/download-artifact@v4
        with:
          pattern: jmeter-dashboard-*
          path: jmeter-dashboard-merged
          merge-multiple: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./jmeter-dashboard-merged
          destination_dir: .
          keep_files: true

  notify:
    name: Notify on Failure
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "❌ JMeter performance tests failed!"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.run_id }}"
          echo "Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
